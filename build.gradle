def getManifestAttributes(String title) {
    return [
            'Specification-Title'     : title,
            'Specification-Vendor'    : 'Mekanism',
            'Specification-Version'   : "${project.mod_version}",
            'Implementation-Title'    : title,
            'Implementation-Version'  : "${project.mod_version}",
            'Implementation-Vendor'   : 'Mekanism',
            'Implementation-Timestamp': new Date().format('yyyy-MM-dd\'T\'HH:mm:ssZ'),
            'Automatic-Module-Name'   : title.toLowerCase(Locale.ROOT)
    ]
}

void addIntegrationFiles(AbstractCopyTask task, SourceSet baseSourceSet, Transformer<?, SourceSet> transformer) {
    for (def integration : integrations) {
        IntegrationSettings settings = (IntegrationSettings) integration.getValue()
        if (settings.shouldCompile()) {
            if (baseSourceSet == sourceSets.main || settings.perModule().enabled()) {
                def integrationSourceSet = getIntegrationSourceSet((String) integration.getKey(), baseSourceSet.name)
                task.from(integrationSourceSet.map(transformer))
                task.dependsOn(integrationSourceSet.map(s -> s.classesTaskName))
            }
        }
    }
}

tasks.named('jar', Jar) {
    dependsOn(apiClasses)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from([sourceSets.api.output, sourceSets.main.output])
    addIntegrationFiles(it, sourceSets.main, s -> s.output)
    exclude('crafttweaker_parameter_names.json')
    manifest.attributes(getManifestAttributes('Mekanism'))
}

tasks.named('sourcesJar', Jar) {
    dependsOn(classes, apiClasses)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    //Note: Already contains main source set's sources by default
    from(sourceSets.api.allJava, sourceSets.additions.allJava, sourceSets.generators.allJava, sourceSets.tools.allJava)
    for (String name : secondaryModules) {
        def secondarySourceSet = sourceSets.named(name).get()
        from(secondarySourceSet.allJava)
        dependsOn(secondarySourceSet.classesTaskName)
    }
    forEachIntegrationSourceSet((settings, integration) -> {
        from(integration.allJava)
        dependsOn(integration.classesTaskName)
    })
    manifest.attributes(getManifestAttributes('Mekanism'))
}

def secondaryJar(SourceSet sourceSet, String title) {
    return tasks.register(sourceSet.jarTaskName, Jar) {
        duplicatesStrategy = DuplicatesStrategy.FAIL
        archiveClassifier.set(sourceSet.name)
        from(sourceSet.output)
        if (!title.isEmpty()) {
            addIntegrationFiles(it, sourceSet, s -> s.output)
            archiveFileName.set("${title}-${project.version}.jar")
        }
        manifest.attributes(getManifestAttributes(title.isEmpty() ? 'Mekanism' : title))
    }
}

