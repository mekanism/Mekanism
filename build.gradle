tasks.register('generatePackageInfos', GeneratePackageInfos, {
    files.from(sourceSets.api.java.srcDirTrees)
    files.from(sourceSets.gameTest.java.srcDirTrees)
    files.from(sourceSets.test.java.srcDirTrees)
    files.from(sourceSets.main.java.srcDirTrees)
    for (String extraType : extraTypes) {
        files.from(getExtraSourceSet(sourceSets.main, extraType).get().java.srcDirTrees)
    }
    for (String name : secondaryModules) {
        def sourceSet = getSourceSet(name).get()
        files.from(sourceSet.java.srcDirTrees)
        for (String extraType : extraTypes) {
            files.from(getExtraSourceSet(sourceSet, extraType).get().java.srcDirTrees)
        }
    }
    for (def integration : integrations as Map<String, IntegrationSettings>) {
        def scope = integration.value.scope()
        if (scope.hasBase) {
            files.from(getIntegrationSourceSet(integration.key).get().java.srcDirTrees)
        }
        if (scope.hasData) {
            files.from(getIntegrationDataSourceSet(integration.key).get().java.srcDirTrees)
        }
        def perModule = integration.value.perModule()
        if (perModule.enabled()) {
            for (String module : secondaryModules) {
                if (scope.hasBase) {
                    files.from(getIntegrationSourceSet(integration.key, module).get().java.srcDirTrees)
                }
                if (scope.hasData && perModule.datagen()) {
                    files.from(getIntegrationDataSourceSet(integration.key, module).get().java.srcDirTrees)
                }
            }
        }
    }
})

tasks.register('optimizePng', OptimizePng, {
    def pngPatterns = ['**/*.png']
    //Ensure the logo is minimized (we add this file to each jar)
    inputFiles.from(layout.projectDirectory.file('logo.png'))
    //Minimize any PNGs in the source sets
    def sourceSets = [sourceSets.main, sourceSets.additions, sourceSets.generators, sourceSets.tools]
    for (def sourceSet : sourceSets) {
        for (def dir : sourceSet.resources.srcDirs) {
            inputFiles.from(fileTree(dir: dir, includes: pngPatterns))
        }
    }
    //TODO: Make optimize png be fully compatible with the configuration cache?
    notCompatibleWithConfigurationCache('Up to date check is not currently compatible with the configuration cache')
    outputs.upToDateWhen {
        //Validate that none of the files has changed size, as the odds that a file has the exact same size and has changed is very low for an image file
        //Note: This is from Chat-GPT, I don't understand why the any check isn't just always true (and thus this being different from returning always false)
        // but it seems to function properly(?), whereas just always returning false does not
        !inputFiles.files.any { file -> file.length() != file.size() }
    }
})

