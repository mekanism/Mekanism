//Create sourceSets and configurations for each of the additional modules in src/$name and adds a reference to
// the corresponding data gen's resource directory excluding the cache. It also adds the api and main mekanism
// module to the dependencies of the source set we are setting up, and sets up all extra source sets that are
// based on the primary added source set
for (String name : secondaryModules) {
    def sourceSet = sourceSets.create(name)
    sourceSet.resources {
        //Add the generated module resources
        srcDirs += ["src/datagen/generated/mekanism${name}"]
        //But exclude the cache of the generated data from what gets built
        exclude('.cache')
    }
    sourceSet.compileClasspath += sourceSets.api.output
    sourceSet.compileClasspath += sourceSets.main.output
    //Expose the module's created source set to the corresponding per module integrations
    for (def integration : integrations as Map<String, IntegrationSettings>) {
        if (integration.value.perModule().enabled()) {
            if (integration.value.scope().hasBase) {
                def integrationSource = getIntegrationSourceSet(integration.key, name).get()
                integrationSource.compileClasspath += sourceSet.output
                integrationSource.runtimeClasspath += sourceSet.runtimeClasspath
            }
            if (integration.value.scope().hasData && integration.value.perModule().datagen()) {
                def integrationDataSource = getIntegrationDataSourceSet(integration.key, name).get()
                integrationDataSource.compileClasspath += sourceSet.output
                integrationDataSource.runtimeClasspath += sourceSet.runtimeClasspath
            }
        }
    }
    //Create all secondary sourceSets for this module
    setupExtraSourceSets(sourceSet)
}

void setupConfigurationExtensions(SourceSet base, SourceSet from, boolean addToClasspath = true) {
    //Setup and extend configurations for alternate modules. First by making the implementation, compileOnly, runtimeOnly, localRuntime equivalents
    // for those modules extend the main ones
    for (def type : ['implementation', 'compileOnly', 'runtimeOnly', 'localRuntime']) {
        def baseConfig = project.configurations.maybeCreate(base.getTaskName(null, type))
        // If this is a secondary module then make the base tasks extend the builtin ones
        if (base != from) {
            baseConfig.extendsFrom(project.configurations.named(from.getTaskName(null, type)).get())
        }
        if (addToClasspath && type == 'localRuntime') {
            base.runtimeClasspath += baseConfig
        }
    }
}

def setupIntegrationSourceSet(String name, IntegrationSettings settings) {
    SourceSet integration = null
    if (settings.scope().hasBase) {
        integration = sourceSets.create(IntegrationSettings.getName(name))
        String path = name
        if (settings.perModule().enabled()) {
            path += '/main'
        }
        integration.java.srcDirs = ["src/integration/${path}/java"]
        integration.resources.srcDirs = ["src/integration/${path}/resources"]
        setGroups(integration)
        //Add the directory where Gradle would usually put the AP sources explicitly so IntelliJ picks it up
        // If we don't do this, IJ seems to run a weird heuristic on where to put the AP sources and put them
        // into the generated resource directory instead
        //TODO: Is this necessary? Do we have AP sources for integrations? We gather names from the CrT one, but I am unsure if that would output to this
        integration.java.srcDir(project.file("build/generated/sources/annotationProcessor/java/${integration.name}"))

        integration.compileClasspath += sourceSets.api.output
        integration.compileClasspath += sourceSets.main.output
        integration.runtimeClasspath += sourceSets.main.runtimeClasspath
        //Note: We don't currently expose integrations to junit or gametests

        setupConfigurationExtensions(integration, sourceSets.main)
        addIntegrationIfShouldCompile(integration, name, 'main', settings)
    }

    SourceSet integrationData = null
    if (settings.scope().hasData) {
        integrationData = sourceSets.create(IntegrationSettings.getDataName(name))
        String path = name
        if (settings.perModule().datagen()) {
            path += '/main'
        }
        integrationData.java.srcDirs = ["src/datagen/integration/${path}/java"]
        integrationData.resources.srcDirs = ["src/datagen/integration/${path}/resources"]
        setGroups(integrationData)

        integrationData.compileClasspath += sourceSets.api.output
        integrationData.compileClasspath += sourceSets.main.output
        if (integration == null) {
            integrationData.runtimeClasspath += sourceSets.main.runtimeClasspath
            setupConfigurationExtensions(integrationData, sourceSets.main)
        } else {
            integrationData.compileClasspath += integration.output
            integrationData.runtimeClasspath += integration.runtimeClasspath
            setupConfigurationExtensions(integrationData, integration)
        }

        if (settings.shouldCompile()) {
            // And add it to the datagen runs
            sourceSets.runData.compileClasspath += integrationData.output
            sourceSets.runData.runtimeClasspath += integrationData.runtimeClasspath
        } else {
            //Note: We need to exclude the code or IntelliJ gets confused when rebuilding to try and hotswap
            println("Disabling main datagen compilation of ${name} integration")
            if (excludeDisabled) integrationData.java.exclude('mekanism/')
        }
    }

    if (settings.perModule().enabled()) {
        //Setup per module integrations
        for (String module : secondaryModules) {
            SourceSet moduleIntegration = null
            if (integration != null) {
                moduleIntegration = sourceSets.create(IntegrationSettings.getName(name, module))
                moduleIntegration.java.srcDirs = ["src/integration/${name}/${module}/java"]
                moduleIntegration.resources.srcDirs = ["src/integration/${name}/${module}/resources"]
                moduleIntegration.java.srcDir(project.file("build/generated/sources/annotationProcessor/java/${moduleIntegration.name}"))
                setGroups(moduleIntegration)

                moduleIntegration.compileClasspath += sourceSets.api.output
                moduleIntegration.compileClasspath += sourceSets.main.output
                moduleIntegration.compileClasspath += integration.output
                //Note: This includes the main runtime class path
                moduleIntegration.runtimeClasspath += integration.runtimeClasspath
                //Note: We don't currently expose integrations to junit or gametests

                setupConfigurationExtensions(moduleIntegration, integration)
                addIntegrationIfShouldCompile(moduleIntegration, name, module, settings)
            }

            if (integrationData != null && settings.perModule().datagen()) {
                SourceSet moduleDataIntegration = sourceSets.create(IntegrationSettings.getDataName(name, module))
                moduleDataIntegration.java.srcDirs = ["src/datagen/integration/${name}/${module}/java"]
                moduleDataIntegration.resources.srcDirs = ["src/datagen/integration/${name}/${module}/resources"]
                setGroups(moduleDataIntegration)

                moduleDataIntegration.compileClasspath += sourceSets.api.output
                moduleDataIntegration.compileClasspath += sourceSets.main.output
                moduleDataIntegration.compileClasspath += integrationData.output
                //Note: This includes the main runtime class path, as well as the base integration runtime class path
                moduleDataIntegration.runtimeClasspath += integrationData.runtimeClasspath

                setupConfigurationExtensions(moduleDataIntegration, integrationData)
                if (integration != null) {
                    moduleDataIntegration.compileClasspath += integration.output
                }
                if (moduleIntegration != null) {
                    moduleDataIntegration.compileClasspath += moduleIntegration.output
                    moduleDataIntegration.runtimeClasspath += moduleIntegration.runtimeClasspath
                    setupConfigurationExtensions(moduleDataIntegration, moduleIntegration, false)
                }
                if (settings.shouldCompile()) {
                    // And add it to the datagen runs
                    sourceSets.runData.compileClasspath += moduleDataIntegration.output
                    sourceSets.runData.runtimeClasspath += moduleDataIntegration.runtimeClasspath
                } else {
                    //Note: We need to exclude the code or IntelliJ gets confused when rebuilding to try and hotswap
                    println("Disabling ${module} datagen compilation of ${name} integration")
                    if (excludeDisabled) moduleDataIntegration.java.exclude('mekanism/')
                }
            }
        }
    }
}

void addIntegrationIfShouldCompile(SourceSet integration, String integrationName, String module, IntegrationSettings settings) {
    if (settings.shouldCompile()) {
        if (settings.scope().hasBase) {
            //Add it to the main run as being something that we want to compile
            sourceSets.runMain.compileClasspath += integration.output
            sourceSets.runMain.runtimeClasspath += integration.runtimeClasspath
        }
        if (settings.scope().hasData) {
            // And add it to the datagen runs
            sourceSets.runData.compileClasspath += integration.output
            sourceSets.runData.runtimeClasspath += integration.runtimeClasspath
        }
    } else {
        //Note: We need to exclude the code or IntelliJ gets confused when rebuilding to try and hotswap
        println("Disabling ${module} compilation of ${integrationName} integration")
        if (excludeDisabled) integration.java.exclude('mekanism/')
    }
}

void setupExtraSourceSets(SourceSet base, boolean includeExtra = true) {
    setGroups(base)
    // Add the directory where Gradle would usually put the AP sources explicitly so IntelliJ picks it up
    // If we don't do this, IJ seems to run a weird heuristic on where to put the AP sources and put them
    // into the generated resource directory instead
    base.java.srcDir(project.file("build/generated/sources/annotationProcessor/java/${base.name}"))

    //Expose the base module to junit
    project.sourceSets.test.compileClasspath += base.output
    if (base != project.sourceSets.gameTest) {
        project.sourceSets.gameTest.compileClasspath += base.output
    }
    //Setup and extend configurations for alternate modules. First by making the implementation, compileOnly, runtimeOnly equivalents
    // for those modules extend the main ones
    setupConfigurationExtensions(base, project.sourceSets.main)

    if (includeExtra) {
        //And then setup and have all the extra sourceSets have their configurations extend the ones for the base module so that they can
        // properly access the dependency
        for (String extraType : extraTypes) {
            //Setup a source set in extraType/$name
            def extraSourceSet = setupExtraSourceSet(base, extraType)
            //And then setup the configurations for it
            setupConfigurationExtensions(extraSourceSet, base)
            if (extraType == 'datagen') {
                sourceSets.runData.compileClasspath += extraSourceSet.output
                sourceSets.runData.runtimeClasspath += extraSourceSet.runtimeClasspath
                for (def integration : integrations as Map<String, IntegrationSettings>) {
                    if (integration.value.scope().hasData) {
                        if (integration.value.perModule().datagen() || base == project.sourceSets.main) {
                            def moduleDataIntegration = getIntegrationDataSourceSet(integration.key, base.name).get()
                            moduleDataIntegration.compileClasspath += extraSourceSet.output
                            moduleDataIntegration.runtimeClasspath += extraSourceSet.runtimeClasspath
                            //Make the integration datagen sourceset able to use dependencies defined in the corresponding module.
                            setupConfigurationExtensions(moduleDataIntegration, extraSourceSet, false)
                        }
                    }
                }
            }
        }
    }
    if (base != project.sourceSets.gameTest) {
        sourceSets.runMain.compileClasspath += base.output
        sourceSets.runMain.runtimeClasspath += base.runtimeClasspath
    }
}

SourceSet setupExtraSourceSet(SourceSet baseSourceSet, String extra) {
    def name = baseSourceSet.name
    def extraSourceSet = sourceSets.create(baseSourceSet.getTaskName(extra, null))
    extraSourceSet.java.srcDirs = ["src/${extra}/${name}/java"]
    //Resources folder for if we have anything get created by our annotation processors or in the case of game tests, for any nbt presets
    extraSourceSet.resources.srcDirs = ["src/${extra}/${name}/resources"]
    setGroups(extraSourceSet)
    extraSourceSet.compileClasspath += project.sourceSets.api.output
    extraSourceSet.compileClasspath += project.sourceSets.main.output
    extraSourceSet.runtimeClasspath += project.sourceSets.main.runtimeClasspath
    if (baseSourceSet != project.sourceSets.main) {
        //If the base sourceSet is main it already is the extra source set and has a reference to the base one from before this if statement
        extraSourceSet.compileClasspath += getExtraSourceSet(project.sourceSets.main, extra).get().output
        extraSourceSet.compileClasspath += baseSourceSet.output
        extraSourceSet.runtimeClasspath += baseSourceSet.runtimeClasspath
    }
    return extraSourceSet
}

static void extendConfigurations(Configuration base, Configuration... configurations) {
    for (def configuration : configurations) {
        configuration.extendsFrom(base)
    }
}

