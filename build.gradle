void setupTasks(SourceSet sourceSet) {
    def compileTask = tasks.named(sourceSet.compileJavaTaskName, JavaCompile, {
        //Configure specific compile tasks to have the proper annotation processor info
        options.annotationProcessorPath = configurations.annotationProcessor
        options.compilerArgs.addAll([
                "-AmekanismModule=mekanism${sourceSet == sourceSets.main ? '' : sourceSet.name}",//annotation processor param
                '-parameters'
        ])
    })
    //Set the various variables/settings for the different process resources tasks
    tasks.named(sourceSet.processResourcesTaskName, ProcessResources, {
        duplicatesStrategy = DuplicatesStrategy.FAIL
        var versionProperties = ['file'       : ['jarVersion': mod_version], 'mc_version': minecraft_version_range, 'neo_version': neo_version_range,
                                 'jei_version': jei_version_range]
        //Mark the properties as inputs so that when they change things update
        inputs.properties(versionProperties)
        filesMatching('META-INF/neoforge.mods.toml') { expand(versionProperties) }
        from(layout.projectDirectory) { include('logo.png') }
        //Depend on the compile task so that we can map the computer methods as needed
        dependsOn(compileTask)
        def files = fileTree(dir: outputs.files.asPath, includes: ['**/*.json', '**/*.mcmeta'])
        doLast {
            for (def file : files) {
                def text = file.getText('UTF-8')
                if (!text.isEmpty()) {
                    try {
                        file.text = JsonOutput.toJson(new JsonSlurper().parseText(text))
                    } catch (Exception e) {
                        throw new RuntimeException("Failed to process '${file}': ${e.getMessage()}", e)
                    }
                } else {
                    logger.warn('File was empty: {}', file)
                }
            }
        }
    })
    for (String extraType : extraTypes) {
        def extraSourceSet = getExtraSourceSet(sourceSet, extraType).get()
        tasks.named(extraSourceSet.processResourcesTaskName, { dependsOn(compileTask) })
    }
}

void setGroups(SourceSet sourceSet) {
    tasks.named(sourceSet.processResourcesTaskName, { setGroup('process resources') })
    tasks.named(sourceSet.compileJavaTaskName, { setGroup('compile') })
}

void forEachIntegrationSourceSet(Consumer<SourceSet> consumer) {
    for (def integration : integrations as Map<String, IntegrationSettings>) {
        if (integration.value.shouldCompile()) {
            if (integration.value.scope().hasBase) {
                consumer.accept(getIntegrationSourceSet(integration.key).get())
            }
            if (integration.value.perModule().enabled()) {
                for (String module : secondaryModules) {
                    if (integration.value.scope().hasBase) {
                        consumer.accept(getIntegrationSourceSet(integration.key, module).get())
                    }
                }
            }
        }
    }
}

group = 'mekanism'
def basicVersion = "${mod_version}." + (System.getenv('BUILD_NUMBER') ?: 'homebaked')
version = "${minecraft_version}-${basicVersion}"
project.base.archivesName = 'Mekanism'
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of("${java_version}"))
        //vendor.set(JvmVendorSpec.JETBRAINS)
    }
    withSourcesJar()
}

neoForge {
    // This enables modding tasks and configurations
    enable {
        version = neo_version
        enabledSourceSets = sourceSets // All source sets use Minecraft code
    }

    accessTransformers = [
            'src/main/resources/META-INF/accesstransformer.cfg',
            'src/additions/resources/META-INF/accesstransformer.cfg',
            //Dev time only ATs so the file name doesn't have to match accesstransformer.cfg
            'src/datagen/main/resources/META-INF/datagen_ats.cfg',
            'src/gameTest/resources/META-INF/gametest_ats.cfg',
    ]
    validateAccessTransformers = true

    //Note: Some of the mods are missing if we don't eagerly resolve them
    //TODO: Maybe this will stop being the case at some point?
    List<ModModel> baseMods = []
    List<ModModel> dataMods = []

    def mekanismMod = mods.register('mekanism')
    mekanismMod.configure({
        modSourceSets.add((SourceSet) sourceSets.api)
        modSourceSets.add((SourceSet) sourceSets.main)
        for (def integration : integrations as Map<String, IntegrationSettings>) {
            if (integration.value.shouldCompile() && integration.value.scope().hasBase) {
                modSourceSets.add(getIntegrationSourceSet(integration.key))
            }
        }
    })
    def mekanismDataMod = mods.register('mekanismData')
    mekanismDataMod.configure({
        modSourceSets = mekanismMod.get().modSourceSets
        modSourceSets.add((SourceSet) sourceSets.datagenMain)
        for (def integration : integrations as Map<String, IntegrationSettings>) {
            if (integration.value.shouldCompile() && integration.value.scope().hasData) {
                modSourceSets.add(getIntegrationDataSourceSet(integration.key))
            }
        }
    })
    def mekanismTestMod = mods.register('mekanismTest')
    mekanismTestMod.configure({
        modSourceSets.add((SourceSet) sourceSets.gameTest)
    })
    baseMods.add(mekanismMod.get())
    dataMods.add(mekanismDataMod.get())
    for (String name : secondaryModules) {
        def moduleMod = mods.register(name)
        moduleMod.configure({
            modSourceSets.add(getSourceSet(name))
            for (def integration : integrations as Map<String, IntegrationSettings>) {
                if (integration.value.shouldCompile() && integration.value.perModule().enabled() && integration.value.scope().hasBase) {
                    modSourceSets.add(getIntegrationSourceSet(integration.key, name))
                }
            }
        })
        def moduleDataMod = mods.register(name + 'Data')
        moduleDataMod.configure({
            final sourceSet = getSourceSet(name)
            modSourceSets.add(sourceSet)
            modSourceSets.add(sourceSet.flatMap(s -> getExtraSourceSet(s, 'datagen')))
            for (def integration : integrations as Map<String, IntegrationSettings>) {
                if (integration.value.shouldCompile() && integration.value.scope().hasData && integration.value.perModule().enabled()) {
                    if (integration.value.scope().hasBase) {
                        modSourceSets.add(getIntegrationSourceSet(integration.key, name))
                    }
                    if (integration.value.perModule().datagen()) {
                        modSourceSets.add(getIntegrationDataSourceSet(integration.key, name))
                    }
                }
            }
        })
        baseMods.add(moduleMod.get())
        dataMods.add(moduleDataMod.get())
    }

    runs.register('client', { run ->
        client()
        //Note: To enable logging into the client account, set the mc_devlogin property to true in your gradle user home
        // You can also run gradlew runClient -Pmc_devlogin=true
        configureRun(baseMods, run, '', true)
    })
    runs.register('clientAlt', { run ->
        client()
        programArguments.addAll('--username', 'AltDev')
        configureRun(baseMods, run)
    })
    runs.register('server', { run ->
        server()
        configureRun(baseMods, run)
    })
    runs.register('gameTestServer', { run ->
        type = 'gameTestServer'
        configureRun(baseMods, run)
        sourceSet = sourceSets.gameTest
        loadedMods.add((Provider<ModModel>) mekanismTestMod)
    })
    runs.register('gameTestClient', { run ->
        client()
        configureRun(baseMods, run, 'client', true)
        sourceSet = sourceSets.gameTest
        loadedMods.add((Provider<ModModel>) mekanismTestMod)
        programArguments.addAll('--quickPlaySingleplayer', 'GameTestWorld')
    })
    runs.register('dataGameTest', { run ->
        //See https://neoforged.net/news/21.4release/ for why we only use clientData instead of splitting and having clientData and serverData
        clientData()
        configureRun(baseMods, run, 'gameTestServer')
        programArguments.addAll('--all', '--output', file('src/gameTest/generated/').absolutePath,
                '--mod', 'mekanismtests', '--existing', file('src/gameTest/resources/').absolutePath)
        sourceSet = sourceSets.gameTest
        loadedMods.add((Provider<ModModel>) mekanismTestMod)
    })
    runs.register('data', { run ->
        //See https://neoforged.net/news/21.4release/ for why we only use clientData instead of splitting and having clientData and serverData
        clientData()
        configureRun(dataMods, run)
        programArguments.addAll('--all', '--output', file('src/datagen/generated/').absolutePath,
                '--mod', 'mekanism', '--existing', file('src/main/resources/').absolutePath)

        sourceSet = sourceSets.runData

        for (String name : secondaryModules) {
            programArguments.addAll('--mod', 'mekanism' + name, '--existing', file("src/${name}/resources/").absolutePath)
        }
    })

    unitTest {
        enable()
        testedMod.set((Provider<ModModel>) mekanismMod)
        loadedMods.addAll(baseMods)
    }
}

void configureRun(List<ModModel> mods, RunModel run, String runDir = '', boolean enableLogin = false) {
    run.gameDirectory = layout.projectDirectory.dir('runs').dir(runDir.isEmpty() ? run.name : runDir)

    // Uncomment this to get verbose debug logging
    // run.logLevel = org.slf4j.event.Level.DEBUG

    final forceAnsi = providers.gradleProperty('forge_force_ansi')
    if (forceAnsi.isPresent()) {
        //Force ansi if declared as a gradle variable, as the auto detection doesn't detect IntelliJ properly
        // or eclipse's plugin that adds support for ansi escape in console
        run.systemProperties.put('terminal.ansi', forceAnsi.get())
    }

    run.loadedMods.addAll(mods)
    run.sourceSet = sourceSets.runMain

    //if the selected toolchain is a JBR, enable DCEVM
    if (javaToolchains.launcherFor(java.toolchain).map(tool -> tool.metadata.vendor.contains('JetBrains')).getOrElse(false)) {
        run.jvmArguments.addAll('-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition')
    }

    run.devLogin = enableLogin && providers.gradleProperty('mc_devlogin').map(val -> val.toBoolean()).getOrElse(false)
}

static void exclusiveRepo(RepositoryHandler handler, String url, String... groups) {
    exclusiveRepo(handler, url, filter -> {
        for (def group : groups) {
            filter.includeGroup(group)
        }
    })
}

static void exclusiveRepo(RepositoryHandler handler, String url, Consumer<InclusiveRepositoryContentDescriptor> filterSetup) {
    handler.exclusiveContent {
        forRepositories(handler.maven {
            setUrl(url)
        })
        filter { f -> filterSetup.accept(f) }
    }
}

