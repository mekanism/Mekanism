# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.configuration-cache=true

java_version=21
minecraft_version=1.21.8
#Used as a helper for porting when deps we use have not updated yet
major_minecraft_version=1.21
previous_minecraft_version=1.21.1
previous_minor_minecraft_version=1.21.6
loader_version_range=[9,)
neo_version=21.8.32
mod_version=10.7.15
#This determines the minimum version of forge required to use Mekanism
# Only bump it whenever we need access to a feature in forge that is not available in earlier versions
neo_version_range=[21.8.25,)
minecraft_version_range=[1.21.8]
#This specifies what type of release it will be uploaded to CurseForge and Modrinth as
# options are: alpha, beta, release
release_type=release

#JUnit/Testing dependencies
junit_version=5.13.4
jqwik_version=1.9.3

#Parchment Settings
neoForge.parchment.minecraftVersion=1.21.8
neoForge.parchment.mappingsVersion=2025.07.20

#misc settings
# recipe viewer, currently accepts: jei, emi, hybrid
